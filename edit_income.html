<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Income</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Edit Income
                    </h3>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Income Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ income[1] }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                name="amount"
                                class="form-control"
                                value="{{ income[2] }}"
                                min="1"
                                step="0.01"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                value="{{ income[3] }}"
                                required
                            >
                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Update Income
                            </button>

                            <a
                                href="/"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
